# Cloudflare Tunnel ingress — ai.berojgardegreewala.com -> shim.
#
# Token mode: tunnel ID + credentials come from TUNNEL_TOKEN (docker
# compose), so this file carries ONLY the routing rules. Runbook:
# ../CLOUDFLARE_TUNNEL.md
#
# Rule order is first-match-wins: the /metrics block MUST stay above the
# hostname rule (metrics are scraped on the private network, never at edge).

ingress:
  # Edge-block observability/debug endpoints (do not leak through CDN).
  - hostname: ai.berojgardegreewala.com
    path: ^/(metrics|debug|internal)(/.*)?$
    service: http_status:404

  # Everything else -> shim (OpenAI-compatible API + /healthz + /v1/*).
  - hostname: ai.berojgardegreewala.com
    service: http://shim:8090

  # Mandatory catch-all: anything unmatched is refused.
  - service: http_status:404
