# P5.1 deploy stack — 70B vLLM (TP) + CPU inference shim + Cloudflare Tunnel.
#
# Topology (no inbound origin ports anywhere):
#   Internet -> Cloudflare edge -> cloudflared (outbound conn) -> shim:8090
#   shim -> vllm:8000 (OpenAI-compatible, ZONE3_BASE_URL)
#
# Secrets come from `.env` (see .env.example) — never commit `.env`.
# Sizing/budget: docs/PHASE5_BDW_INTEGRATION_BLUEPRINT.md §8 ("verify at
# purchase" — Oct-2026 spot prices drift).

x-vllm-defaults: &vllm-defaults
  image: ${VLLM_IMAGE:-ghcr.io/vllm-project/vllm-openai:latest}
  # Pin to a digest before production (supplychain): VLLM_IMAGE=ghcr.io/...@sha256:...
  restart: unless-stopped
  shm_size: "16gb"
  # Graceful model load can take many minutes on a cold HF cache.
  stop_grace_period: 60s
  environment:
    HUGGING_FACE_HF_TOKEN: ${HF_TOKEN:-}
    # vLLM writes the HF cache inside the container volume below.
    HF_HOME: /cache/huggingface
  volumes:
    - hf-cache:/cache/huggingface
  networks: [bdw]
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
    interval: 15s
    timeout: 5s
    retries: 40
    start_period: 300s

services:
  vllm:
    <<: *vllm-defaults
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-72B-Instruct}
      - --tensor-parallel-size
      - ${TP_SIZE:-2}
      - --max-model-len
      - ${MAX_MODEL_LEN:-8192}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - ${VLLM_DTYPE:-auto}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEM_UTIL:-0.92}
      # LoRA (P5.1 open item): the 5 existing adapters are 7B-shaped and
      # CANNOT attach to a 70B base. Enable only after QLoRA retraining:
      # - --enable-lora --max-lora-rank 32
  # NOTE: vllm publishes no host port. It is reachable only on the `bdw`
  # compose network (shim uses http://vllm:8000).

  shim:
    build:
      context: ../..          # repo root: Dockerfile COPYs phase3/4/5
      dockerfile: phase5/serve/Dockerfile
    image: ${SHIM_IMAGE:-bdw-shim:local}
    restart: unless-stopped
    environment:
      # --- Zone 3 (vLLM) ------------------------------------------------
      ZONE3_BASE_URL: http://vllm:8000
      # 70B prompt processing on CPU-side prefill: P5's 15s default is too
      # low (cluster lesson); 300s matches PARAM Rudra staging.
      ZONE3_TIMEOUT_S: ${ZONE3_TIMEOUT_S:-300}
      # Required: vLLM rejects /chat/completions without a `model` field.
      ZONE3_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-72B-Instruct}
      # --- P5 shim settings --------------------------------------------
      P5_API_KEY: ${P5_API_KEY:?set P5_API_KEY in .env}
      P5_AUTH_MODE: ${P5_AUTH_MODE:-required}
      P5_MODEL: ${P5_MODEL:-bdw-career-ai}
      P5_STREAM_UPSTREAM: ${P5_STREAM_UPSTREAM:-true}
      P5_METRICS_TOKEN: ${P5_METRICS_TOKEN:-}
      P5_SSE_HEARTBEAT_S: ${P5_SSE_HEARTBEAT_S:-10}
      P5_READY_URL: http://vllm:8000/health
      # --- Zone 2 / RAG mounts (volumes below) --------------------------
      PH4_RAG_DIR: /data/rag
      PH4_BGE_DIR: /data/bge
      P4_DOMAIN_BACKEND: ${P4_DOMAIN_BACKEND:-file}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - ${RAG_DIR:?set RAG_DIR in .env}:/data/rag:ro
      - ${BGE_DIR:?set BGE_DIR in .env}:/data/bge:ro
    ports:
      # Debug/localhost only. Public exposure is the Tunnel's job; edge
      # blocks /metrics (see cloudflared/config.yml).
      - "127.0.0.1:8090:8090"
    depends_on:
      vllm:
        condition: service_healthy
    networks: [bdw]

  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Token embeds tunnel ID + credentials (dashboard-managed tunnel).
      # Creation/runbook: CLOUDFLARE_TUNNEL.md
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      - shim
    networks: [bdw]

networks:
  bdw:
    driver: bridge

volumes:
  hf-cache:
