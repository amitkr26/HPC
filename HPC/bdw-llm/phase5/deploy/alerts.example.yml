# P5.1 example alert rules — copy into your rule_files (see
# prometheus.example.yml). Thresholds mirror slo.json (draft): re-baseline
# after the first P5_LIVE_OK week before enabling paging.

groups:
  - name: bdw-shim-slo
    rules:
      - alert: BdwShimHighErrorRate
        expr: |
          sum(rate(bdw_shim_requests_total{route="chat",status=~"5.."}[5m]))
            / sum(rate(bdw_shim_requests_total{route="chat"}[5m]))
            > 0.02
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "shim 5xx rate > 2% for 10m"
          runbook: "phase5/deploy/CLOUDFLARE_TUNNEL.md#7-troubleshooting"

      - alert: BdwShimRateLimitStorm
        expr: |
          sum(rate(bdw_shim_upstream_errors_total{type="rate_limit"}[5m]))
            / sum(rate(bdw_shim_requests_total{route="chat"}[5m]))
            > 0.05
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Zone 3 / vLLM rate limiting > 5% of traffic"
          runbook: "lower concurrency, raise max-model-len pressure, or scale TP"

      - alert: BdwShimUpstreamTimeouts
        expr: |
          sum(rate(bdw_shim_upstream_errors_total{type="timeout"}[10m])) > 0.1
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "sustained upstream timeouts (ZONE3_TIMEOUT_S vs model latency)"
          runbook: "check vllm logs; consider ZONE3_TIMEOUT_S, TP_SIZE, MAX_MODEL_LEN"

      - alert: BdwShimTTFTP95Breach
        expr: |
          histogram_quantile(0.95,
            sum(rate(bdw_shim_ttft_seconds_bucket[10m])) by (le))
            > 4
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "TTFT p95 > 4s (draft SLO target)"

      - alert: BdwShimInflightLeak
        expr: max_over_time(bdw_shim_requests_in_flight[30m]) > 50
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "in-flight gauge stuck high — possible stream teardown leak"
          runbook: "phase5/serve/tests/test_streaming.py (cancellation contract)"

  - name: bdw-shim-up
    rules:
      - alert: BdwShimDown
        expr: up{job="bdw-shim"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "shim scrape target down (host, container, or edge path)"
