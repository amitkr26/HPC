<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BDW Assistant — Zone 1 demo</title>
<style>
  :root { --ink:#1a1d23; --mut:#68707d; --line:#dde1e7; --acc:#0b62d6; --bg:#f6f7f9; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--mut); margin:10px 0 4px; text-transform:uppercase; letter-spacing:.03em; }
  textarea, input, select { width:100%; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  textarea { min-height:84px; resize:vertical; }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; }
  button { margin-top:14px; background:var(--acc); color:#fff; border:0; border-radius:8px; padding:10px 22px; font:inherit; font-weight:600; cursor:pointer; }
  button[disabled] { opacity:.55; cursor:default; }
  .badge { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; border-radius:999px; padding:2px 10px; margin-right:6px; }
  .b-web { background:#e8f0fe; color:#0b62d6; }
  .b-loc { background:#e6f4ea; color:#137333; }
  .b-warn { background:#fef3e0; color:#9a5b00; }
  .ans { white-space:pre-wrap; }
  a.cite { color:var(--acc); text-decoration:none; font-weight:700; font-size:12px; vertical-align:super; margin:0 1px; }
  .chunks { font-size:12.5px; color:var(--mut); }
  .chunks li { margin-bottom:6px; }
  .err { color:#b3261e; }
  .meta-line { margin-top:10px; font-size:12px; color:var(--mut); }
</style>
</head>
<body>
<div class="wrap">
  <h1>BDW Assistant</h1>
  <div class="sub">Advanced Certificate Course — HPC (AI) &middot; Zone 2 gateway demo. Answers come from the seeded course DB; the router may add live web sources.</div>

  <div class="card">
    <label for="base">Gateway base URL</label>
    <input id="base" spellcheck="false" placeholder="(leave blank for same origin, e.g. http://127.0.0.1:8787)">
    <label for="q">Question</label>
    <textarea id="q" placeholder="e.g. What is the deadline for the HPC-AI admissions?"></textarea>
    <div class="row">
      <div><label for="uid">User id (rate-limit bucket)</label><input id="uid" placeholder="guest"></div>
      <div><label for="web">Web search</label>
        <select id="web">
          <option value="auto">auto — escalate when fresh/weak</option>
          <option value="on">on — always search the web</option>
          <option value="off">off — course DB only</option>
        </select></div>
    </div>
    <button id="go">Ask</button>
    <span id="status" class="meta-line"></span>
  </div>

  <div class="card" id="out" hidden>
    <div id="badges"></div>
    <div id="answer" class="ans"></div>
    <div id="warn"></div>
    <hr>
    <div id="chunks" class="chunks"></div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
function base() {
  const b = $("base").value.trim();
  if (b) return b.replace(/\/+$/, "");
  return location.protocol.startsWith("http") && location.port !== ""
    ? location.origin : "http://127.0.0.1:8787";
}
function esc(s) { return String(s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderCitations(answerHTML, chunks) {
  return answerHTML.replace(/&lt;cite id=&quot;([^&]+)&quot;\s*\/?&gt;/g, (m, id) => {
    const n = parseInt(id, 10);
    const c = (Number.isInteger(n) && chunks[n]) ? chunks[n] : null;
    const title = c ? (c.title || c.url || "source " + n) : "citation " + id;
    const href = (c && c.url) ? c.url : "#";
    return ' <a class="cite" href="' + esc(href) + '" target="_blank" rel="noopener" title="' + esc(title) + '">[' + esc(id) + "]</a>";
  });
}

$("go").onclick = async () => {
  const q = $("q").value.trim();
  if (!q) { $("status").textContent = "type a question first"; return; }
  $("go").disabled = true;
  $("status").textContent = "asking\u2026";
  try {
    const r = await fetch(base() + "/ask", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: q,
                            user_id: $("uid").value.trim() || "guest",
                            web: $("web").value})
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
    const meta = j.meta || {};
    const chunks = meta.chunks || [];
    $("badges").innerHTML =
      '<span class="badge ' + (meta.routing && meta.routing.web_used ? "b-web" : "b-loc") + '">'
      + (meta.routing && meta.routing.web_used ? "web + local" : "local db") + "</span>"
      + (meta.routing ? '<span class="badge b-loc">' + esc(meta.routing.reason) + "</span>" : "");
    $("answer").innerHTML = renderCitations(esc(j.answer || ""), chunks);
    $("warn").innerHTML = (j.answer && /verifier \(S5\)/.test(j.answer))
      ? '<div class="meta-line err">Some citation marks were removed by the server-side verifier.</div>' : "";
    $("chunks").innerHTML = "Sources this answer was allowed to use:"
      + '<ul>' + chunks.map((c, i) =>
          "<li>[" + i + "] " + esc(c.title || c.id)
          + " &middot; " + esc(c.source || "db")
          + (c.verified ? " &middot; verified" : " &middot; unverified")
          + (c.url ? ' &middot; <a href="' + esc(c.url) + '" target="_blank" rel="noopener">link</a>' : "")
          + "</li>").join("") + "</ul>";
    $("out").hidden = false;
    $("status").textContent = "";
  } catch (e) {
    $("status").textContent = "";
    $("out").hidden = false;
    $("badges").innerHTML = "";
    $("answer").innerHTML = '<span class="err">Request failed: ' + esc(e.message)
      + '</span><br><span class="meta-line">Is the gateway up? (run_stack.sh on the cluster, or app.py locally)</span>';
    $("warn").innerHTML = "";
    $("chunks").innerHTML = "";
  } finally {
    $("go").disabled = false;
  }
};
$("q").addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("go").click(); } });
</script>
</body>
</html>
