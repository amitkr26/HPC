<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Automated Weather Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #result { margin-top: 20px; color: #333; }
    </style>
</head>
<body>
    <h1>Welcome to the Automated Weather Dashboard</h1>
    <p>Fetches live weather data, archives it, and stores it in a database.</p>

    <button onclick="updateWeather()">Fetch latest weather</button>
    <p><a href="/api/v1/weather">View stored readings (JSON)</a></p>
    <p id="result"></p>

    <script>
        function updateWeather() {
            fetch("/api/v1/update", { method: "POST" })
                .then(response => response.json())
                .then(data => {
                    document.getElementById("result").innerText =
                        data.status === "success" ? "Weather data updated." : "Update failed: " + data.message;
                });
        }
    </script>
</body>
</html>
